<html lang="tr">
<head>
<meta charset="utf-8">

<title>Musteri Paneli</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0b0f14; color: #e6edf3; }
header { padding: 18px 22px; border-bottom: 1px solid #1f2a37; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
h1 { font-size: 17px; margin: 0; font-weight: 600; }
.muted { color: #8b98a5; font-size: 12px; }
.wrap { padding: 16px 22px 40px; }
#gate { max-width: 380px; margin: 12vh auto; padding: 24px; border: 1px solid #1f2a37; border-radius: 12px; background: #0f151c; }
input, select, button { font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid #2a3644; background: #0f151c; color: #e6edf3; }
button { cursor: pointer; background: #1d4ed8; border-color: #1d4ed8; }
button.ghost { background: #0f151c; border-color: #2a3644; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.card { border: 1px solid #1f2a37; border-radius: 10px; padding: 10px 12px; background: #0f151c; }
.card b { display: block; font-size: 20px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 9px; border-bottom: 1px solid #17202b; vertical-align: top; }
th { position: sticky; top: 0; background: #0f151c; cursor: pointer; user-select: none; white-space: nowrap; }
tr:hover td { background: #101823; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid #2a3644; }
.tag.reply { border-color: #b45309; color: #fbbf24; }
.tag.follow { border-color: #0369a1; color: #7dd3fc; }
.tag.group { border-color: #4b5563; color: #9ca3af; }
.cell { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details summary { cursor: pointer; color: #7dd3fc; }
.err { color: #f87171; }
</style>
</head>
<body>
<div id="gate">
  <h1>Musteri Paneli</h1>
  <p class="muted">Bu sayfa sifre ile korunur. Veriler tarayicida cozulur; sayfa kaynagi sifreli metin icerir.</p>
  <p><input id="pw" type="password" placeholder="Sifre" autocomplete="current-password" style="width:100%"></p>
  <p><button id="go" style="width:100%">Giris</button></p>
  <p id="msg" class="muted"></p>
</div>
<div id="app" hidden>
  <header>
    <h1>Musteri Paneli</h1>
    <span class="muted" id="stamp"></span>
    <span style="flex:1"></span>
    <input id="q" placeholder="Ara: isim, mesaj..." style="min-width:220px">
    <label class="muted"><input type="checkbox" id="fReply"> Cevap bekleyen</label>
    <label class="muted"><input type="checkbox" id="fFollow"> Takip</label>
    <label class="muted"><input type="checkbox" id="fGroup"> Gruplar</label>
    <button class="ghost" id="reload">Yenile</button>
  </header>
  <div class="wrap">
    <div class="grid" id="cards"></div>
    <div style="overflow:auto; max-height:72vh; border:1px solid #1f2a37; border-radius:10px">
      <table id="t">
        <thead><tr>
          <th data-k="name">Musteri</th><th data-k="source">Kaynak</th><th data-k="needsReply">Durum</th>
          <th data-k="firstAt">Ilk mesaj</th><th data-k="lastAt">Son mesaj</th><th data-k="count">Adet</th>
          <th data-k="lastIncoming">Son gelen</th><th data-k="lastOutgoing">Biz ne dedik</th><th data-k="draft">Taslak</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

const $ = (s) => document.querySelector(s);
const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let DATA = null, SORT = { k: 'lastAt', dir: -1 };

async function unlock(pw) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(BLOB.salt), iterations: BLOB.iter, hash: 'SHA-256' },
    key, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BLOB.iv), tagLength: 128 }, k,
    new Uint8Array([...b64(BLOB.ct), ...b64(BLOB.tag)]));
  return JSON.parse(new TextDecoder().decode(pt));
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const onlyReply = $('#fReply').checked, onlyFollow = $('#fFollow').checked, onlyGroup = $('#fGroup').checked;
  let rows = DATA.rows.filter(r => {
    if (onlyReply && !r.needsReply) return false;
    if (onlyFollow && !r.needsFollowup) return false;
    if (onlyGroup && !r.isGroup) return false;
    if (!q) return true;
    return (r.name + ' ' + r.id + ' ' + (r.lastIncoming ? r.lastIncoming.body : '') + ' ' + (r.lastOutgoing ? r.lastOutgoing.body : '')).toLowerCase().includes(q);
  });
  const k = SORT.k;
  rows.sort((a, b) => {
    const va = k === 'lastIncoming' ? (a.lastIncoming ? a.lastIncoming.at : '') : k === 'lastOutgoing' ? (a.lastOutgoing ? a.lastOutgoing.at : '') : a[k];
    const vb = k === 'lastIncoming' ? (b.lastIncoming ? b.lastIncoming.at : '') : k === 'lastOutgoing' ? (b.lastOutgoing ? b.lastOutgoing.at : '') : b[k];
    return (va > vb ? 1 : va < vb ? -1 : 0) * SORT.dir;
  });
  const t = $('#t tbody');
  t.innerHTML = rows.map(r => `<tr>
    <td><b>${esc(r.name)}</b><div class="muted">${esc(r.id)} ${r.isGroup ? '<span class="tag group">grup</span>' : ''} ${r.unread ? '· okunmamis ' + r.unread : ''}</div></td>
    <td>${esc(r.source)}<div class="muted">${esc(r.language)}</div></td>
    <td>${r.needsReply ? '<span class="tag reply">cevap</span> ' : ''}${r.needsFollowup ? '<span class="tag follow">takip</span>' : ''}${(!r.needsReply && !r.needsFollowup) ? '<span class="muted">-</span>' : ''}<div class="muted">oncelik ${r.priority}</div></td>
    <td class="muted">${esc(r.firstAt)}</td>
    <td class="muted">${esc(r.lastAt)}</td>
    <td>${r.count}<div class="muted">${r.incomingCount} gelen</div></td>
    <td class="cell">${r.lastIncoming ? esc(r.lastIncoming.body) : '<span class="muted">-</span>'}<div class="muted">${r.lastIncoming ? esc(r.lastIncoming.at) : ''}</div></td>
    <td class="cell">${r.lastOutgoing ? esc(r.lastOutgoing.body) : '<span class="muted">-</span>'}<div class="muted">${r.lastOutgoing ? esc(r.lastOutgoing.at) : ''}</div></td>
    <td>${r.draft ? '<details><summary>' + esc(r.draft.action || 'taslak') + '</summary><div class="cell">' + esc(r.draft.text) + '</div></details>' : '<span class="muted">-</span>'}</td>
  </tr>`).join('');
  const s = DATA.totals;
  $('#cards').innerHTML = [
    ['Musteri', s.persons], ['Grup', s.groups], ['Cevap bekleyen', s.needsReply],
    ['Takip', s.needsFollowup], ['Mesaj', s.messages], ['Taslak', s.drafts]
  ].map(([a, b]) => '<div class="card"><span class="muted">' + a + '</span><b>' + b + '</b></div>').join('');
  $('#stamp').textContent = 'Guncelleme: ' + DATA.generatedAt.replace('T', ' ').slice(0, 16) + (DATA.scan ? ' · son tarama ' + String(DATA.scan.finishedAt || '').slice(0, 16) : '');
}

$('#go').onclick = async () => {
  $('#msg').textContent = 'Cozuluyor...';
  try {
    DATA = await unlock($('#pw').value);
    $('#gate').hidden = true; $('#app').hidden = false;
    render();
    setTimeout(() => location.reload(), 300000);
  } catch (e) { $('#msg').innerHTML = '<span class="err">Sifre hatali veya veri bozuk.</span>'; }
};
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-k]');
  if (th) { const k = th.dataset.k; SORT = { k, dir: SORT.k === k ? -SORT.dir : -1 }; render(); }
});
['q', 'fReply', 'fFollow', 'fGroup'].forEach(id => document.addEventListener('input', e => { if (e.target.id === id) render(); }));
$('#reload').onclick = () => location.reload();
</script>
</body>
